<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
/* Direction C for Google Play, from store/app-store/1.0/source/frame-c.html: the
   same teal ground, caption sizes (1u = canvas width / 440) and phone body, on a
   9:16 canvas (360 x 640 CSS at 3x = 1080 x 1920). The phone is shorter than on
   the iPhone canvas because 9:16 is shorter; it stays complete. */
html, body { margin: 0; background: #00506A; }
#c { position: relative; overflow: hidden; width: var(--W); height: var(--H);
  font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: linear-gradient(180deg, #006784 0%, #00506A 100%); }
#c::before { content: ''; position: absolute; inset: 0; background: radial-gradient(90% 40% at 50% 0%, rgba(255,255,255,.14), rgba(255,255,255,0) 70%); }
#cap { position: absolute; left: calc(18 * var(--u)); right: calc(18 * var(--u)); top: calc(34 * var(--u)); height: calc(150 * var(--u)); text-align: center; overflow: hidden; }
#eye { display: inline-flex; align-items: center; gap: calc(7 * var(--u)); font-size: calc(12.5 * var(--u)); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #DFF4F2; margin-bottom: calc(10 * var(--u)); }
#eye i { width: calc(6 * var(--u)); height: calc(6 * var(--u)); border-radius: 99px; background: #8CFCF9; display: inline-block; }
#t { margin: 0; font-weight: 800; font-size: calc(27 * var(--u)); line-height: 1.08; letter-spacing: -.025em; text-wrap: balance; }
#s { margin: calc(10 * var(--u)) auto 0; font-weight: 500; font-size: calc(14.5 * var(--u)); line-height: 1.35; color: rgba(255,255,255,.86); text-wrap: balance; }
#dev { position: absolute; left: 50%; transform: translateX(-50%); top: calc(178 * var(--u)); height: calc(580 * var(--u));
  padding: calc(8 * var(--u)); box-sizing: border-box; border-radius: calc(30 * var(--u)); background: #121318;
  box-shadow: inset 0 0 0 calc(1.5 * var(--u)) #34363F, 0 calc(30 * var(--u)) calc(60 * var(--u)) calc(-24 * var(--u)) rgba(0,20,28,.65); }
#dev img { display: block; height: 100%; width: auto; border-radius: calc(22 * var(--u)); }
/* A generic punch-hole camera over the status bar, as most Android phones have. */
#dev::after { content: ''; position: absolute; left: 50%; top: calc(14 * var(--u)); transform: translateX(-50%); width: calc(9 * var(--u)); height: calc(9 * var(--u)); border-radius: 99px; background: #0B0C10; }
#check { display: none; }
</style></head>
<body><div id="c"><div id="cap"><div id="eye"><i></i><span id="e"></span></div><h1 id="t"></h1><p id="s"></p></div><div id="dev"><img id="img" alt=""></div></div>
<pre id="check"></pre>
<script>
// The approved captions, exactly (owner, 2026-10-15), and one alternate for
// frame 2 (2a): the Android sheet offers Take photo and Choose file, not the
// iOS document scanner.
const FRAMES = {
  1: ['Home', 'See what this month cost, in each currency', 'Each currency is totalled on its own, never converted.'],
  2: ['Scan', 'Scan a receipt, or add a photo or PDF', 'Reading runs while you keep using the app.'],
  '2a': ['Add', 'Photograph a receipt, or add a photo or PDF', 'Reading runs while you keep using the app.'],
  3: ['Receipt', 'Merchant, total and date, read for you', 'The receipt photo stays one tap away.'],
  4: ['Review', 'Approve or reject what needs a second look', 'Receipts that need a person wait in one place.'],
  5: ['Search', 'Find any receipt by merchant, category or month', 'Totals for what you found, one per currency.'],
};
const p = new URLSearchParams(location.search);
const W = Number(p.get('w') || 360), H = Number(p.get('h') || 640), n = p.get('n') || '1';
const c = document.getElementById('c'); c.style.setProperty('--u', (W / 440) + 'px'); c.style.setProperty('--W', W + 'px'); c.style.setProperty('--H', H + 'px');
const [e, t, s] = FRAMES[n];
document.getElementById('e').textContent = e; document.getElementById('t').textContent = t; document.getElementById('s').textContent = s;
const img = document.getElementById('img');
img.onload = () => document.fonts.ready.then(() => {
  const r = (el) => el.getBoundingClientRect();
  const C = r(c), cap = r(document.getElementById('cap')), dev = r(document.getElementById('dev')), I = r(img);
  const inner = ['eye', 't', 's'].map((id) => r(document.getElementById(id)));
  const lines = (id) => Math.round(r(document.getElementById(id)).height / parseFloat(getComputedStyle(document.getElementById(id)).lineHeight));
  document.getElementById('check').textContent = JSON.stringify({
    n, w: C.width, h: C.height, capText: [e, t, s].join(' | '),
    noDash: !/[—–]/.test([e, t, s].join('')),
    captionFits: inner.every((b) => b.top >= cap.top - 0.5 && b.bottom <= cap.bottom + 0.5 && b.left >= cap.left - 0.5 && b.right <= cap.right + 0.5),
    titleLines: lines('t'), subLines: lines('s'),
    gapCaptionToPhone: +(dev.top - inner[2].bottom).toFixed(1),
    phoneInside: dev.left >= C.left && dev.right <= C.right && dev.top >= C.top && dev.bottom <= C.bottom,
    marginBottom: +(C.bottom - dev.bottom).toFixed(1), marginSide: +(dev.left - C.left).toFixed(1),
    screenWholeInPhone: I.top >= dev.top && I.bottom <= dev.bottom && I.left >= dev.left && I.right <= dev.right,
    imgNatural: [img.naturalWidth, img.naturalHeight], screenScale: +(I.width / C.width).toFixed(4),
    fontInter: document.fonts.check('800 20px Inter'),
  });
});
img.src = p.get('img');
</script></body></html>
