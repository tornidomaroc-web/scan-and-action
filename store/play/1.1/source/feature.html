<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
/* Google Play feature graphic, 1024 x 500. No device: the concept A icon
   (apps/frontend/assets/scan-action-mark.svg, the master every icon is
   generated from) on the direction C teal, the name, one line. Everything
   that matters sits inside the central 924 x 400. */
html, body { margin: 0; }
#c { position: relative; width: 1024px; height: 500px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF;
  background: linear-gradient(180deg, #006784 0%, #00506A 100%); display: flex; align-items: center; gap: 56px; padding: 0 96px; box-sizing: border-box; }
#c::before { content: ''; position: absolute; inset: 0; background: radial-gradient(70% 70% at 22% 50%, rgba(255,255,255,.16), rgba(255,255,255,0) 70%); }
#icon { position: relative; flex: none; width: 232px; height: 232px; border-radius: 52px; overflow: hidden;
  box-shadow: 0 0 0 1.5px rgba(255,255,255,.14), 0 30px 60px -24px rgba(0,20,28,.7); }
#icon img { display: block; width: 100%; height: 100%; }
#txt { position: relative; display: grid; gap: 16px; min-width: 0; }
#name { margin: 0; font-weight: 800; font-size: 68px; line-height: 1; letter-spacing: -.03em; }
#line { margin: 0; font-weight: 500; font-size: 30px; line-height: 1.25; color: rgba(255,255,255,.88); text-wrap: balance; max-width: 520px; }
#eye { display: inline-flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #DFF4F2; }
#eye i { width: 9px; height: 9px; border-radius: 99px; background: #8CFCF9; display: inline-block; }
#check { display: none; }
</style></head>
<body><div id="c"><div id="icon"><img id="img" alt=""></div>
<div id="txt"><div id="eye"><i></i><span>Receipts</span></div><h1 id="name">Scan &amp; Action</h1><p id="line">Merchant, total and date, read for you</p></div></div>
<pre id="check"></pre>
<script>
const img = document.getElementById('img');
img.onload = () => document.fonts.ready.then(() => {
  const C = document.getElementById('c').getBoundingClientRect();
  const safe = { l: 50, r: 974, t: 50, b: 450 };
  const boxes = ['icon', 'eye', 'name', 'line'].map((id) => [id, document.getElementById(id).getBoundingClientRect()]);
  document.getElementById('check').textContent = JSON.stringify({ w: C.width, h: C.height, fontInter: document.fonts.check('800 20px Inter'),
    insideSafe: boxes.every(([, b]) => b.left >= safe.l && b.right <= safe.r && b.top >= safe.t && b.bottom <= safe.b),
    boxes: Object.fromEntries(boxes.map(([k, b]) => [k, [Math.round(b.left), Math.round(b.top), Math.round(b.right), Math.round(b.bottom)]])) });
});
img.src = new URLSearchParams(location.search).get('img');
</script></body></html>
