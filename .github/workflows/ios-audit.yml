name: iOS — binary audit

# Builds the app for the iOS Simulator on a pull request and reads what the
# linked binary carries. No signing, no App Store Connect key, no environment,
# no secret of any kind: the job proves a property of the code, and a fork can
# run it without reaching anything.
#
# WHAT IT ANSWERS (2026-09-29). Whether the app binary links a framework the
# app must not carry. Today that is AppTrackingTransparency and the Facebook
# SDK: @capgo/capacitor-social-login links facebook-ios-sdk unconditionally in
# its Package.swift, and its FacebookProvider.swift imports
# AppTrackingTransparency outside the FBSDKLoginKit guard, so the framework is
# autolinked even when no code calls it. capacitor.config.ts turns the Facebook
# provider off (the plugin's sync hook comments the package out of the
# manifest) and patches/ guards the import. This job is the reading that says
# whether those two changes reached the binary; the same reading runs on the
# archive in ios-testflight.yml before an upload. Only after it is green is
# NSUserTrackingUsageDescription removed from Info.plist.
#
# WHY A SIMULATOR BUILD. A device build needs a signing identity; a simulator
# build needs none, and the framework list of the binary is the same question
# on both. The reading is `otool -L` on App.app/App (the load commands the
# linker wrote), the embedded Frameworks directory, and the checkouts SwiftPM
# resolved. Each reading carries its own positive control, so an empty or
# misread output fails rather than passes: `otool -L` must name UIKit, and the
# checkouts must include capacitor-swift-pm.
#
# TRIGGER. pull_request, restricted to the paths that change what Xcode links:
# the iOS project, capacitor.config.ts (the provider map), patches/, and the
# npm manifests (a plugin upgrade). Not a required check in the ruleset today;
# it reports on the PR. `set -e` does not fire on a negated command, so every
# forbidden-match test is written as an explicit `if ...; then exit 1; fi`.
#
# COST. Free on a public repository (docs.github.com, runners reference, read
# 2026-09-27); $0.062 per macOS minute if the repository ever goes private.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/ios/**'
      - 'apps/frontend/capacitor.config.ts'
      - 'apps/frontend/patches/**'
      - 'apps/frontend/package.json'
      - 'apps/frontend/package-lock.json'
      - '.github/workflows/ios-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: iOS — simulator build and binary audit (no signing, no secrets)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # postinstall runs patch-package here: the FacebookProvider.swift guard
      # is applied to node_modules before cap sync reads it.
      - run: npm ci

      # The Supabase pair is deliberately absent: the audit reads load commands
      # off the binary, and the bundle's contents do not change what is linked.
      - name: Build the web bundle
        run: npm run build

      # The plugin's capacitor:sync:before hook reads plugins.SocialLogin.providers
      # from capacitor.config.ts and rewrites its own Package.swift.
      - name: Sync the iOS project
        run: npx cap sync ios

      - name: The plugin manifest no longer links Facebook, and the import guard is in place
        run: |
          set -eu
          f=node_modules/@capgo/capacitor-social-login/Package.swift
          echo "facebook lines in $f:"
          grep -nE 'facebook-ios-sdk|FacebookCore|FacebookLogin' "$f"
          # positive control: the hook left the lines in place, commented
          test "$(grep -cE '^\s*//.*(facebook-ios-sdk|FacebookCore|FacebookLogin)' "$f")" -eq 3 || { echo "expected the three Facebook lines commented out by the sync hook"; exit 1; }
          if grep -qE '^\s*\.(package|product)\(.*(facebook-ios-sdk|FacebookCore|FacebookLogin)' "$f"; then echo "Package.swift still links Facebook"; exit 1; fi
          p=node_modules/@capgo/capacitor-social-login/ios/Sources/SocialLoginPlugin/FacebookProvider.swift
          grep -n 'import AppTrackingTransparency' -B1 "$p"
          grep -qF '#if canImport(FBSDKLoginKit) && canImport(AppTrackingTransparency)' "$p" || { echo "the AppTrackingTransparency import guard from patches/ is not applied"; exit 1; }

      # The signing job never takes these from the artifact: it uses the
      # committed copies (ios/ci/expected). A pull request that changes
      # capacitor.config.ts, the plugin set, or the social-login plugin must
      # update them, and this is where a stale copy shows.
      - name: The committed expectations are what cap sync wrote
        run: |
          set -eu
          cmp ios/App/App/capacitor.config.json ios/ci/expected/capacitor.config.json || { echo "capacitor.config.json changed: copy ios/App/App/capacitor.config.json over ios/ci/expected/capacitor.config.json and commit"; exit 1; }
          cmp ios/App/App/config.xml ios/ci/expected/config.xml || { echo "config.xml changed: copy ios/App/App/config.xml over ios/ci/expected/config.xml and commit"; exit 1; }
          cmp node_modules/@capgo/capacitor-social-login/Package.swift ios/ci/expected/capgo-capacitor-social-login.Package.swift || { echo "the social-login manifest changed: copy node_modules/@capgo/capacitor-social-login/Package.swift over ios/ci/expected/capgo-capacitor-social-login.Package.swift and commit"; exit 1; }
          echo "the three committed expectations match this sync"

      # The same assembly the signing job performs, on this runner image, with
      # no secret: a staged copy of what the web job uploads, judged against a
      # fresh worktree of the commit. The assembled tree is not what this job
      # builds (it builds the synced tree, as before); this proves the script
      # and the tool set on macOS before the first run on main.
      - name: Assemble from the commit, as the signing job does (untouched artifact)
        run: |
          set -eu
          art="$RUNNER_TEMP/artifact"
          mkdir -p "$art/node_modules/@capacitor" "$art/node_modules/@capgo"
          cp -R ios "$art/ios"
          for p in app camera splash-screen status-bar; do cp -R "node_modules/@capacitor/$p" "$art/node_modules/@capacitor/$p"; done
          cp -R node_modules/@capgo/capacitor-social-login "$art/node_modules/@capgo/"
          git worktree add -q "$RUNNER_TEMP/clean" HEAD
          bash ios/ci/assemble.sh "$art" "$RUNNER_TEMP/clean/apps/frontend" | tee "$RUNNER_TEMP/assemble.log"
          grep -q '^ASSEMBLED from the commit' "$RUNNER_TEMP/assemble.log"
          git worktree remove --force "$RUNNER_TEMP/clean"

      - name: Xcode in use
        run: |
          sudo xcode-select -p
          xcodebuild -version

      # The same resolution the signing job runs, on the pull request: the
      # committed Package.resolved or nothing. When a plugin change moves the
      # package graph this step fails, resolves again without the flag and
      # prints the file to commit; that is the way a new one is made without
      # a Mac.
      - name: Resolve Swift packages from the committed Package.resolved
        run: |
          set -eu -o pipefail
          resolved=ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          test -f "$resolved" || { echo "Package.resolved is not committed"; exit 1; }
          strict() {
            xcodebuild \
              -resolvePackageDependencies \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
              "$@" 2>&1 | tee "$RUNNER_TEMP/resolve.log" | { grep -E '^(warning|error|\*\*|Resolved|Fetching|Cloning|Creating)|: (error|warning):' || true; }
          }
          if strict -onlyUsePackageVersionsFromResolvedFile && git diff --exit-code -- "$resolved"; then
            echo "the committed Package.resolved resolves as written"
          else
            echo "FAIL: the committed Package.resolved does not match the package graph. Resolving without the flag; commit the file printed below."
            tail -n 20 "$RUNNER_TEMP/resolve.log"
            strict || true
            echo "===== Package.resolved ====="; cat "$resolved"; echo "===== end ====="
            exit 1
          fi

      - name: Build for the iOS Simulator (unsigned)
        run: |
          set -eu -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -E '^(warning|error|\*\*|Build)|: (error|warning):' || true; }

      - name: Audit the binary
        run: |
          set -eu
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -n "$app" || { echo "no App.app under $RUNNER_TEMP/dd/Build/Products"; ls -R "$RUNNER_TEMP/dd/Build/Products" | head -n 40; exit 1; }
          bin="$app/App"
          test -f "$bin"
          echo "binary: $bin"

          echo "== linked frameworks (otool -L) =="
          otool -L "$bin" | tee "$RUNNER_TEMP/otool.txt"
          grep -q 'UIKit.framework' "$RUNNER_TEMP/otool.txt" || { echo "otool -L named no UIKit: the reading is empty, not clean"; exit 1; }
          if grep -iqE 'AppTrackingTransparency|FBSDK|Facebook' "$RUNNER_TEMP/otool.txt"; then
            echo "FAIL: the binary links a framework the app must not carry (see above)"; exit 1
          fi

          echo "== embedded frameworks =="
          if [ -d "$app/Frameworks" ]; then ls -1 "$app/Frameworks"; else echo "(none)"; fi
          if [ -d "$app/Frameworks" ] && ls -1 "$app/Frameworks" | grep -iqE 'FBSDK|Facebook'; then
            echo "FAIL: a Facebook framework is embedded"; exit 1
          fi

          echo "== packages SwiftPM resolved =="
          ls -1 "$RUNNER_TEMP/spm/checkouts"
          ls -1 "$RUNNER_TEMP/spm/checkouts" | grep -q 'capacitor-swift-pm' || { echo "no capacitor-swift-pm checkout: the resolution reading is empty"; exit 1; }
          if ls -1 "$RUNNER_TEMP/spm/checkouts" | grep -iq 'facebook'; then
            echo "FAIL: SwiftPM still fetched the Facebook SDK"; exit 1
          fi

          echo "== undefined symbols mentioning tracking (nm -u) =="
          nm -u "$bin" | grep -i 'ATTracking' || echo "(none)"
          if nm -u "$bin" | grep -iq 'ATTracking'; then
            echo "FAIL: the binary references ATTrackingManager"; exit 1
          fi

          echo "AUDIT PASSED: no AppTrackingTransparency, no Facebook SDK in the linked binary"

      # A build is not a launch. Main.storyboard and project.pbxproj are edited
      # by hand here (there is no Mac), and a storyboard naming a class the
      # runtime cannot find builds cleanly and then opens on an empty view
      # controller: a blank app, with every fallback dead inside it. So the
      # app is started in a simulator and must say three things through the
      # file MainViewController writes when SA_LAUNCH_SMOKE=1 (simulator
      # builds only): that class was instantiated, the web view finished
      # loading the bundled page as a native Capacitor page, and the scanner
      # plugin is registered in it. No file means the class never ran.
      - name: Launch smoke test (the app starts, our view controller loads, the web view comes up)
        run: |
          set -eu
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -d "$app"
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[(r,x["udid"],x["name"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]; c.sort(); print(c[-1][1])')
          test -n "$udid"
          echo "simulator: $(xcrun simctl list devices available | grep "$udid")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b | tail -n 2
          xcrun simctl install "$udid" "$app"
          SIMCTL_CHILD_SA_LAUNCH_SMOKE=1 xcrun simctl launch "$udid" com.scanaction.app --sa-launch-smoke
          data=$(xcrun simctl get_app_container "$udid" com.scanaction.app data)
          marker="$data/tmp/launch-smoke.json"
          smoke_log() { xcrun simctl spawn "$udid" log show --last 12m --predicate 'process == "App"' 2>/dev/null | grep -E "$1" | tail -n 20 || true; }
          echo "app data container: $data"
          for i in $(seq 1 150); do
            if [ -f "$marker" ] && grep -q '"ready":"complete"' "$marker" && grep -q '"scanner":true' "$marker"; then break; fi
            sleep 2
          done
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/launch.png" >/dev/null 2>&1 || true
          if [ ! -f "$marker" ]; then
            echo "FAIL: no launch-smoke.json after 300 s: MainViewController never ran (the storyboard did not instantiate it, or the app did not start)"
            ls -laR "$data/tmp" | head -n 40 || true
            find "$data" -name 'launch-smoke.json' || true
            smoke_log 'LaunchSmoke'
            xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -i scanaction || echo "(the app process is not running)"
            xcrun simctl spawn "$udid" log show --last 8m --predicate 'process == "App"' 2>/dev/null | grep -iE 'Unknown class|Interface Builder|crash|fatal|exception' | tail -n 20 || true
            exit 1
          fi
          echo "launch-smoke.json: $(cat "$marker")"
          xcrun simctl spawn "$udid" log show --last 8m --predicate 'process == "App"' 2>/dev/null | grep -iE 'Unknown class|WebContent|did fail|error' | tail -n 12 || true
          for want in '"controller":"MainViewController"' '"ready":"complete"' '"href":"capacitor://localhost' '"native":true' '"scanner":true' '"root":true'; do
            grep -qF "$want" "$marker" || { echo "FAIL: the launch marker lacks $want"; exit 1; }
          done
          xcrun simctl terminate "$udid" com.scanaction.app || true
          xcrun simctl shutdown "$udid" || true
          echo "LAUNCH SMOKE PASSED: MainViewController loaded, the web view finished loading the bundled page, DocumentScanner is registered"

      - name: Keep the launch screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launch-screenshot-${{ github.sha }}
          path: ${{ runner.temp }}/launch.png
          if-no-files-found: ignore
          retention-days: 7

      # Apple 2.5.1: public APIs only. The third-party plugin over VisionKit's
      # document camera looks up a private class by name and exchanges one of
      # its methods (read 2026-09-30); both names are string literals, so they
      # sit in the binary's strings. The reading is proven on a planted file
      # first, and on this binary's own class name, so an empty output cannot
      # pass as a clean one. The source-level scan is in iosPlatform.test.ts.
      - name: No private API name in the binary
        run: |
          set -eu
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          bin="$app/App"
          test -f "$bin"
          # Prints the hits and exits 0 when the file carries a private name.
          private_names() { strings -a "$1" | grep -E '_InProcess|documentCameraController:canAddImages:'; }

          printf 'xx\0VNDocumentCameraViewController_InProcess\0documentCameraController:canAddImages:\0yy' > "$RUNNER_TEMP/planted"
          if ! private_names "$RUNNER_TEMP/planted" > "$RUNNER_TEMP/planted.txt"; then
            echo "the reading did not catch the planted names: it proves nothing"; exit 1
          fi
          echo "control, caught in the planted file:"; cat "$RUNNER_TEMP/planted.txt"
          test "$(wc -l < "$RUNNER_TEMP/planted.txt" | tr -d ' ')" -eq 2 || { echo "expected both planted names"; exit 1; }

          strings -a "$bin" > "$RUNNER_TEMP/strings.txt"
          echo "strings read from the binary: $(wc -l < "$RUNNER_TEMP/strings.txt" | tr -d ' ')"
          grep -q 'DocumentScannerPlugin' "$RUNNER_TEMP/strings.txt" || { echo "the binary's strings name no DocumentScannerPlugin: the reading is empty, not clean"; exit 1; }
          grep -c 'VNDocumentCameraViewController' "$RUNNER_TEMP/strings.txt" || true
          if private_names "$bin" > "$RUNNER_TEMP/private.txt"; then
            echo "FAIL: the binary carries a private API name:"; cat "$RUNNER_TEMP/private.txt"; exit 1
          fi
          echo "PRIVATE API SCAN PASSED: the scanner is in the binary, and no private name is"

  # The tamper proof, where no key can exist: ios/ci/assemble-mutations.sh
  # assembles an untouched artifact and then refuses eleven tampered copies
  # (a Run Script build phase in project.pbxproj, ExportOptions.plist flipped,
  # Package.resolved moved, a tracked file dropped, a script, a plist, a
  # hidden file and a symlink in the web bundle, capacitor.config.json
  # pointed at a remote server, the social-login manifest linking Facebook
  # again, a plugin source edited, a plugin source added), each before any
  # archive, each naming what was tampered. Linux is enough: the script is
  # bash, git, python3, curl, tar, patch, cmp and diff, and the audit job
  # above runs the untouched case on the macOS image.
  assemble-mutations:
    name: iOS — assemble.sh refuses a tampered artifact (no signing, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Build the web bundle and sync, as the web job does
        run: |
          npm run build
          npx cap sync ios

      - name: Stage what the web job uploads
        run: |
          set -eu
          art="$RUNNER_TEMP/artifact"
          mkdir -p "$art/node_modules/@capacitor" "$art/node_modules/@capgo"
          cp -R ios "$art/ios"
          for p in app camera splash-screen status-bar; do cp -R "node_modules/@capacitor/$p" "$art/node_modules/@capacitor/$p"; done
          cp -R node_modules/@capgo/capacitor-social-login "$art/node_modules/@capgo/"

      - name: One untouched artifact assembles; every tampered one is refused before any archive
        env:
          REQUIRE_SYMLINK_CASE: "1"
        run: bash ios/ci/assemble-mutations.sh "$RUNNER_TEMP/artifact" "$GITHUB_WORKSPACE"
