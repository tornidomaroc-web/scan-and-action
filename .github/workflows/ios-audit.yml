name: iOS — binary audit

# Builds the app for the iOS Simulator on a pull request and reads what the
# linked binary carries. No signing, no App Store Connect key, no environment,
# no secret of any kind: the job proves a property of the code, and a fork can
# run it without reaching anything.
#
# WHAT IT ANSWERS (2026-09-29). Whether the app binary links a framework the
# app must not carry. Today that is AppTrackingTransparency and the Facebook
# SDK: @capgo/capacitor-social-login links facebook-ios-sdk unconditionally in
# its Package.swift, and its FacebookProvider.swift imports
# AppTrackingTransparency outside the FBSDKLoginKit guard, so the framework is
# autolinked even when no code calls it. capacitor.config.ts turns the Facebook
# provider off (the plugin's sync hook comments the package out of the
# manifest) and patches/ guards the import. This job is the reading that says
# whether those two changes reached the binary; the same reading runs on the
# archive in ios-testflight.yml before an upload. Only after it is green is
# NSUserTrackingUsageDescription removed from Info.plist.
#
# WHY A SIMULATOR BUILD. A device build needs a signing identity; a simulator
# build needs none, and the framework list of the binary is the same question
# on both. The reading is `otool -L` on App.app/App (the load commands the
# linker wrote), the embedded Frameworks directory, and the checkouts SwiftPM
# resolved. Each reading carries its own positive control, so an empty or
# misread output fails rather than passes: `otool -L` must name UIKit, and the
# checkouts must include capacitor-swift-pm.
#
# TRIGGER. pull_request, restricted to the paths that change what Xcode links:
# the iOS project, capacitor.config.ts (the provider map), patches/, and the
# npm manifests (a plugin upgrade), and since 2026-10-12 the files that decide
# where a confirm link lands (see the universal-link job). Not a required
# check in the ruleset today;
# it reports on the PR. `set -e` does not fire on a negated command, so every
# forbidden-match test is written as an explicit `if ...; then exit 1; fi`.
#
# COST. Free on a public repository (docs.github.com, runners reference, read
# 2026-09-27); $0.062 per macOS minute if the repository ever goes private.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/ios/**'
      - 'apps/frontend/capacitor.config.ts'
      - 'apps/frontend/patches/**'
      - 'apps/frontend/package.json'
      - 'apps/frontend/package-lock.json'
      - '.github/workflows/ios-audit.yml'
      # The universal link check below: what decides whether a confirm link
      # opens the app (ios/** above holds the entitlements and SceneDelegate).
      - 'apps/frontend/public/app-links/**'
      - 'apps/frontend/vercel.json'
      - 'apps/frontend/src/App.tsx'
      - 'apps/frontend/src/native/NativeAuthLinks.tsx'
      - 'apps/frontend/src/lib/authLinks.ts'
      - 'apps/frontend/src/screens/AuthConfirmScreen.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: iOS — simulator build and binary audit (no signing, no secrets)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # postinstall runs patch-package here: the FacebookProvider.swift guard
      # is applied to node_modules before cap sync reads it.
      - run: npm ci

      # The Supabase pair is deliberately absent: the audit reads load commands
      # off the binary, and the bundle's contents do not change what is linked.
      - name: Build the web bundle
        run: npm run build

      # The plugin's capacitor:sync:before hook reads plugins.SocialLogin.providers
      # from capacitor.config.ts and rewrites its own Package.swift.
      - name: Sync the iOS project
        run: npx cap sync ios

      - name: The plugin manifest no longer links Facebook, and the import guard is in place
        run: |
          set -eu
          f=node_modules/@capgo/capacitor-social-login/Package.swift
          echo "facebook lines in $f:"
          grep -nE 'facebook-ios-sdk|FacebookCore|FacebookLogin' "$f"
          # positive control: the hook left the lines in place, commented
          test "$(grep -cE '^\s*//.*(facebook-ios-sdk|FacebookCore|FacebookLogin)' "$f")" -eq 3 || { echo "expected the three Facebook lines commented out by the sync hook"; exit 1; }
          if grep -qE '^\s*\.(package|product)\(.*(facebook-ios-sdk|FacebookCore|FacebookLogin)' "$f"; then echo "Package.swift still links Facebook"; exit 1; fi
          p=node_modules/@capgo/capacitor-social-login/ios/Sources/SocialLoginPlugin/FacebookProvider.swift
          grep -n 'import AppTrackingTransparency' -B1 "$p"
          grep -qF '#if canImport(FBSDKLoginKit) && canImport(AppTrackingTransparency)' "$p" || { echo "the AppTrackingTransparency import guard from patches/ is not applied"; exit 1; }

      # The signing job never takes these from the artifact: it uses the
      # committed copies (ios/ci/expected). A pull request that changes
      # capacitor.config.ts, the plugin set, or the social-login plugin must
      # update them, and this is where a stale copy shows.
      - name: The committed expectations are what cap sync wrote
        run: |
          set -eu
          cmp ios/App/App/capacitor.config.json ios/ci/expected/capacitor.config.json || { echo "capacitor.config.json changed: copy ios/App/App/capacitor.config.json over ios/ci/expected/capacitor.config.json and commit"; exit 1; }
          cmp ios/App/App/config.xml ios/ci/expected/config.xml || { echo "config.xml changed: copy ios/App/App/config.xml over ios/ci/expected/config.xml and commit"; exit 1; }
          cmp node_modules/@capgo/capacitor-social-login/Package.swift ios/ci/expected/capgo-capacitor-social-login.Package.swift || { echo "the social-login manifest changed: copy node_modules/@capgo/capacitor-social-login/Package.swift over ios/ci/expected/capgo-capacitor-social-login.Package.swift and commit"; exit 1; }
          echo "the three committed expectations match this sync"

      # The same assembly the signing job performs, on this runner image, with
      # no secret: a staged copy of what the web job uploads, judged against a
      # fresh worktree of the commit. The assembled tree is not what this job
      # builds (it builds the synced tree, as before); this proves the script
      # and the tool set on macOS before the first run on main.
      - name: Assemble from the commit, as the signing job does (untouched artifact)
        run: |
          set -eu
          art="$RUNNER_TEMP/artifact"
          mkdir -p "$art/node_modules/@capacitor" "$art/node_modules/@capgo"
          cp -R ios "$art/ios"
          for p in app camera splash-screen status-bar; do cp -R "node_modules/@capacitor/$p" "$art/node_modules/@capacitor/$p"; done
          cp -R node_modules/@capgo/capacitor-social-login "$art/node_modules/@capgo/"
          git worktree add -q "$RUNNER_TEMP/clean" HEAD
          bash ios/ci/assemble.sh "$art" "$RUNNER_TEMP/clean/apps/frontend" | tee "$RUNNER_TEMP/assemble.log"
          grep -q '^ASSEMBLED from the commit' "$RUNNER_TEMP/assemble.log"
          git worktree remove --force "$RUNNER_TEMP/clean"

      - name: Xcode in use
        run: |
          sudo xcode-select -p
          xcodebuild -version

      # The same resolution the signing job runs, on the pull request: the
      # committed Package.resolved or nothing. When a plugin change moves the
      # package graph this step fails, resolves again without the flag and
      # prints the file to commit; that is the way a new one is made without
      # a Mac.
      - name: Resolve Swift packages from the committed Package.resolved
        run: |
          set -eu -o pipefail
          resolved=ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          test -f "$resolved" || { echo "Package.resolved is not committed"; exit 1; }
          strict() {
            xcodebuild \
              -resolvePackageDependencies \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
              "$@" 2>&1 | tee "$RUNNER_TEMP/resolve.log" | { grep -E '^(warning|error|\*\*|Resolved|Fetching|Cloning|Creating)|: (error|warning):' || true; }
          }
          if strict -onlyUsePackageVersionsFromResolvedFile && git diff --exit-code -- "$resolved"; then
            echo "the committed Package.resolved resolves as written"
          else
            echo "FAIL: the committed Package.resolved does not match the package graph. Resolving without the flag; commit the file printed below."
            tail -n 20 "$RUNNER_TEMP/resolve.log"
            strict || true
            echo "===== Package.resolved ====="; cat "$resolved"; echo "===== end ====="
            exit 1
          fi

      - name: Build for the iOS Simulator (unsigned)
        run: |
          set -eu -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -E '^(warning|error|\*\*|Build)|: (error|warning):' || true; }

      - name: Audit the binary
        run: |
          set -eu
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -n "$app" || { echo "no App.app under $RUNNER_TEMP/dd/Build/Products"; ls -R "$RUNNER_TEMP/dd/Build/Products" | head -n 40; exit 1; }
          bin="$app/App"
          test -f "$bin"
          echo "binary: $bin"

          echo "== linked frameworks (otool -L) =="
          otool -L "$bin" | tee "$RUNNER_TEMP/otool.txt"
          grep -q 'UIKit.framework' "$RUNNER_TEMP/otool.txt" || { echo "otool -L named no UIKit: the reading is empty, not clean"; exit 1; }
          if grep -iqE 'AppTrackingTransparency|FBSDK|Facebook' "$RUNNER_TEMP/otool.txt"; then
            echo "FAIL: the binary links a framework the app must not carry (see above)"; exit 1
          fi

          echo "== embedded frameworks =="
          if [ -d "$app/Frameworks" ]; then ls -1 "$app/Frameworks"; else echo "(none)"; fi
          if [ -d "$app/Frameworks" ] && ls -1 "$app/Frameworks" | grep -iqE 'FBSDK|Facebook'; then
            echo "FAIL: a Facebook framework is embedded"; exit 1
          fi

          echo "== packages SwiftPM resolved =="
          ls -1 "$RUNNER_TEMP/spm/checkouts"
          ls -1 "$RUNNER_TEMP/spm/checkouts" | grep -q 'capacitor-swift-pm' || { echo "no capacitor-swift-pm checkout: the resolution reading is empty"; exit 1; }
          if ls -1 "$RUNNER_TEMP/spm/checkouts" | grep -iq 'facebook'; then
            echo "FAIL: SwiftPM still fetched the Facebook SDK"; exit 1
          fi

          echo "== undefined symbols mentioning tracking (nm -u) =="
          nm -u "$bin" | grep -i 'ATTracking' || echo "(none)"
          if nm -u "$bin" | grep -iq 'ATTracking'; then
            echo "FAIL: the binary references ATTrackingManager"; exit 1
          fi

          echo "AUDIT PASSED: no AppTrackingTransparency, no Facebook SDK in the linked binary"

      # A build is not a launch. Main.storyboard and project.pbxproj are edited
      # by hand here (there is no Mac), and a storyboard naming a class the
      # runtime cannot find builds cleanly and then opens on an empty view
      # controller: a blank app, with every fallback dead inside it. So the
      # app is started in a simulator and must say three things through the
      # file MainViewController writes when SA_LAUNCH_SMOKE=1 (simulator
      # builds only): that class was instantiated, the web view finished
      # loading the bundled page as a native Capacitor page, and the scanner
      # plugin is registered in it. No file means the class never ran.
      - name: Launch smoke test (the app starts, our view controller loads, the web view comes up)
        run: |
          set -eu
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -d "$app"
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[(r,x["udid"],x["name"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]; c.sort(); print(c[-1][1])')
          test -n "$udid"
          echo "simulator: $(xcrun simctl list devices available | grep "$udid")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b | tail -n 2
          xcrun simctl install "$udid" "$app"
          SIMCTL_CHILD_SA_LAUNCH_SMOKE=1 xcrun simctl launch "$udid" com.scanaction.app --sa-launch-smoke
          data=$(xcrun simctl get_app_container "$udid" com.scanaction.app data)
          marker="$data/tmp/launch-smoke.json"
          smoke_log() { xcrun simctl spawn "$udid" log show --last 12m --predicate 'process == "App"' 2>/dev/null | grep -E "$1" | tail -n 20 || true; }
          echo "app data container: $data"
          for i in $(seq 1 150); do
            if [ -f "$marker" ] && grep -q '"ready":"complete"' "$marker" && grep -q '"scanner":true' "$marker"; then break; fi
            sleep 2
          done
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/launch.png" >/dev/null 2>&1 || true
          if [ ! -f "$marker" ]; then
            echo "FAIL: no launch-smoke.json after 300 s: MainViewController never ran (the storyboard did not instantiate it, or the app did not start)"
            ls -laR "$data/tmp" | head -n 40 || true
            find "$data" -name 'launch-smoke.json' || true
            smoke_log 'LaunchSmoke'
            xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -i scanaction || echo "(the app process is not running)"
            xcrun simctl spawn "$udid" log show --last 8m --predicate 'process == "App"' 2>/dev/null | grep -iE 'Unknown class|Interface Builder|crash|fatal|exception' | tail -n 20 || true
            exit 1
          fi
          echo "launch-smoke.json: $(cat "$marker")"
          xcrun simctl spawn "$udid" log show --last 8m --predicate 'process == "App"' 2>/dev/null | grep -iE 'Unknown class|WebContent|did fail|error' | tail -n 12 || true
          for want in '"controller":"MainViewController"' '"ready":"complete"' '"href":"capacitor://localhost' '"native":true' '"scanner":true' '"root":true'; do
            grep -qF "$want" "$marker" || { echo "FAIL: the launch marker lacks $want"; exit 1; }
          done
          xcrun simctl terminate "$udid" com.scanaction.app || true
          xcrun simctl shutdown "$udid" || true
          echo "LAUNCH SMOKE PASSED: MainViewController loaded, the web view finished loading the bundled page, DocumentScanner is registered"

      - name: Keep the launch screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launch-screenshot-${{ github.sha }}
          path: ${{ runner.temp }}/launch.png
          if-no-files-found: ignore
          retention-days: 7

      # Apple 2.5.1: public APIs only. The third-party plugin over VisionKit's
      # document camera looks up a private class by name and exchanges one of
      # its methods (read 2026-09-30); both names are string literals, so they
      # sit in the binary's strings. The reading is proven on a planted file
      # first, and on this binary's own class name, so an empty output cannot
      # pass as a clean one. The source-level scan is in iosPlatform.test.ts.
      - name: No private API name in the binary
        run: |
          set -eu
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          bin="$app/App"
          test -f "$bin"
          # Prints the hits and exits 0 when the file carries a private name.
          private_names() { strings -a "$1" | grep -E '_InProcess|documentCameraController:canAddImages:'; }

          printf 'xx\0VNDocumentCameraViewController_InProcess\0documentCameraController:canAddImages:\0yy' > "$RUNNER_TEMP/planted"
          if ! private_names "$RUNNER_TEMP/planted" > "$RUNNER_TEMP/planted.txt"; then
            echo "the reading did not catch the planted names: it proves nothing"; exit 1
          fi
          echo "control, caught in the planted file:"; cat "$RUNNER_TEMP/planted.txt"
          test "$(wc -l < "$RUNNER_TEMP/planted.txt" | tr -d ' ')" -eq 2 || { echo "expected both planted names"; exit 1; }

          strings -a "$bin" > "$RUNNER_TEMP/strings.txt"
          echo "strings read from the binary: $(wc -l < "$RUNNER_TEMP/strings.txt" | tr -d ' ')"
          grep -q 'DocumentScannerPlugin' "$RUNNER_TEMP/strings.txt" || { echo "the binary's strings name no DocumentScannerPlugin: the reading is empty, not clean"; exit 1; }
          grep -c 'VNDocumentCameraViewController' "$RUNNER_TEMP/strings.txt" || true
          if private_names "$bin" > "$RUNNER_TEMP/private.txt"; then
            echo "FAIL: the binary carries a private API name:"; cat "$RUNNER_TEMP/private.txt"; exit 1
          fi
          echo "PRIVATE API SCAN PASSED: the scanner is in the binary, and no private name is"

  # The tamper proof, where no key can exist: ios/ci/assemble-mutations.sh
  # assembles an untouched artifact and then refuses eleven tampered copies
  # (a Run Script build phase in project.pbxproj, ExportOptions.plist flipped,
  # Package.resolved moved, a tracked file dropped, a script, a plist, a
  # hidden file and a symlink in the web bundle, capacitor.config.json
  # pointed at a remote server, the social-login manifest linking Facebook
  # again, a plugin source edited, a plugin source added), each before any
  # archive, each naming what was tampered. Linux is enough: the script is
  # bash, git, python3, curl, tar, patch, cmp and diff, and the audit job
  # above runs the untouched case on the macOS image.
  assemble-mutations:
    name: iOS — assemble.sh refuses a tampered artifact (no signing, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Build the web bundle and sync, as the web job does
        run: |
          npm run build
          npx cap sync ios

      - name: Stage what the web job uploads
        run: |
          set -eu
          art="$RUNNER_TEMP/artifact"
          mkdir -p "$art/node_modules/@capacitor" "$art/node_modules/@capgo"
          cp -R ios "$art/ios"
          for p in app camera splash-screen status-bar; do cp -R "node_modules/@capacitor/$p" "$art/node_modules/@capacitor/$p"; done
          cp -R node_modules/@capgo/capacitor-social-login "$art/node_modules/@capgo/"

      - name: One untouched artifact assembles; every tampered one is refused before any archive
        env:
          REQUIRE_SYMLINK_CASE: "1"
        run: bash ios/ci/assemble-mutations.sh "$RUNNER_TEMP/artifact" "$GITHUB_WORKSPACE"

  # THE UNIVERSAL LINK CHECK (2026-10-12). Whether a confirmation link,
  # https://www.scan-action.com/auth/confirm?token_hash=…, opens INSIDE the
  # app and lands on its confirm screen, cold and warm, while an unclaimed
  # path does not. It reads the committed App.entitlements, SceneDelegate,
  # NativeAuthLinks, authLinks, AuthConfirmScreen, App.tsx's route, the
  # association file and the vercel.json rewrite that serves it, together.
  #
  # IT REACHES NOTHING OUTSIDE THIS RUNNER. Three things the probe of
  # 2026-10-10 (run 38074908976) depended on are cut:
  #   - Apple's CDN. The test build claims the domain with ?mode=developer
  #     (Apple, entitlement reference: "bypass the CDN and connect directly to
  #     your server", "any valid SSL certificate … including a certificate
  #     that the system doesn't trust"), and the runner's hosts file sends
  #     www.scan-action.com to a server on this runner. So the association
  #     swcd applies is THIS commit's file, through THIS commit's rewrite, and
  #     an Apple outage cannot turn the check red. Through the CDN it would
  #     have read production's file, whatever the pull request changed.
  #   - Production. The local server answers only what vercel.json rewrites.
  #   - Supabase. The bundle is built against https://supabase.invalid (RFC
  #     6761: never resolves), so the confirm screen's verifyOtp gets no
  #     answer and the screen must read "network". That reading is the proof
  #     that no request left the runner.
  # Every red therefore says something about this commit, except "swcd never
  # asked the server", which is printed as a harness failure, by name.
  #
  # The committed entitlement is held twice: statically (the last step), and
  # dynamically, because the test entitlements are DERIVED from
  # App.entitlements, so an entry removed there is removed from the test.
  universal-link:
    name: iOS — a confirm link opens the app, offline (no Apple CDN, no production, no Supabase)
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/frontend
    env:
      LINK: https://www.scan-action.com/auth/confirm?token_hash=ulcheck0000&type=email
      IN_APP: capacitor://localhost/auth/confirm?token_hash=ulcheck0000&type=email
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      # Nothing here is a credential: both hosts are .invalid and never
      # resolve, and the key is a label. The bundle is then searched for any
      # supabase.co address, with the .invalid one as the control.
      - name: Build the web bundle against addresses that never resolve, and sync iOS
        env:
          VITE_SUPABASE_URL: https://supabase.invalid
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_never_sent
          VITE_API_URL: https://backend.invalid/api
        run: |
          set -eu
          npm run build
          grep -rqF 'https://supabase.invalid' dist/assets || { echo "control failed: the bundle does not carry the .invalid address"; exit 1; }
          if grep -rqE '[a-z0-9]{20}\.supabase\.co' dist/assets; then echo "FAIL: the bundle names a real supabase.co project"; exit 1; fi
          echo "bundle: Supabase is https://supabase.invalid, no supabase.co address"
          npx cap sync ios

      - name: Resolve Swift packages from the committed Package.resolved
        run: |
          set -eu -o pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -onlyUsePackageVersionsFromResolvedFile 2>&1 | tail -n 3

      # Derived, never copied: every applinks entry of the committed file gets
      # ?mode=developer, and nothing else changes, so a domain missing there
      # is missing here. The App ID comes from project.pbxproj, not from the
      # association file, so a mismatch between the two shows as a red.
      # Xcode's simulator form (the probe's fifth run): entitlements in the
      # binary's __entitlements section under a plain ad-hoc signature; a
      # signature carrying them made SpringBoard refuse the launch.
      - name: Build for the Simulator with the committed entitlements in developer mode
        run: |
          set -eu -o pipefail
          pbx=ios/App/App.xcodeproj/project.pbxproj
          team=$(grep -m1 -oE 'DEVELOPMENT_TEAM = [A-Z0-9]+;' "$pbx" | awk '{print $3}' | tr -d ';')
          bid=$(grep -m1 -oE 'PRODUCT_BUNDLE_IDENTIFIER = [A-Za-z0-9.]+;' "$pbx" | awk '{print $3}' | tr -d ';')
          echo "APP_ID=$team.$bid" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$bid" >> "$GITHUB_ENV"
          ent="$RUNNER_TEMP/test.entitlements"
          python3 - ios/App/App/App.entitlements "$ent" "$team" "$bid" <<'PY'
          import plistlib, sys
          src, out, team, bid = sys.argv[1:5]
          e = plistlib.load(open(src, 'rb'))
          key = 'com.apple.developer.associated-domains'
          if key in e:
              e[key] = [d + '?mode=developer' if d.startswith('applinks:') else d for d in e[key]]
          e['application-identifier'] = f'{team}.{bid}'
          e['com.apple.developer.team-identifier'] = team
          e['get-task-allow'] = True
          plistlib.dump(e, open(out, 'wb'))
          print('test entitlements, associated domains:', e.get(key, '(none: the committed file claims no domain)'))
          PY
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS="$ent" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -E '^(error|\*\*)|: error:' || true; }
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
          strings - "$app/App" > "$RUNNER_TEMP/app-strings.txt"
          grep -qF "$team.$bid" "$RUNNER_TEMP/app-strings.txt" || { echo "control failed: the binary does not carry the application-identifier, so its entitlements were not read"; exit 1; }
          echo "applinks entries in the binary's entitlements:"
          grep -oE 'applinks:[^<]+' "$RUNNER_TEMP/app-strings.txt" | sort -u || echo "  (none)"

      # Serves exactly what vercel.json rewrites to, from the built dist/ (what
      # Vercel deploys), with vercel.json's headers. Everything else is 404.
      # Every request is logged, which is how the check knows swcd asked.
      - name: Serve this commit's association on www.scan-action.com, on this runner
        run: |
          set -eu
          srv="$RUNNER_TEMP/aasa"; mkdir -p "$srv"
          cat > "$srv/openssl.cnf" <<'CNF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = www.scan-action.com
          [ext]
          subjectAltName = DNS:www.scan-action.com
          basicConstraints = critical,CA:TRUE
          keyUsage = digitalSignature,keyCertSign
          extendedKeyUsage = serverAuth
          CNF
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout "$srv/key.pem" -out "$srv/cert.pem" -config "$srv/openssl.cnf" 2>/dev/null
          cat > "$srv/server.py" <<'PY'
          import http.server, json, mimetypes, os, socket, ssl, sys, time
          root, vercel, log, cert, key = sys.argv[1:6]
          root = os.path.realpath(root)
          cfg = json.load(open(vercel))
          exact = lambda src: not any(c in src for c in '(:*')
          rewrites = {r['source']: r['destination'] for r in cfg.get('rewrites', []) if exact(r['source'])}
          headers = {h['source']: {x['key']: x['value'] for x in h['headers']} for h in cfg.get('headers', []) if exact(h['source'])}
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  path = self.path.split('?')[0]
                  body, ctype = None, None
                  dest = rewrites.get(path)
                  if dest:
                      f = os.path.realpath(os.path.join(root, dest.lstrip('/')))
                      if f.startswith(root + os.sep) and os.path.isfile(f):
                          body = open(f, 'rb').read()
                          ctype = mimetypes.guess_type(f)[0] or 'application/octet-stream'
                  status = 200 if body is not None else 404
                  with open(log, 'a') as out:
                      out.write(f"{status} {path} at={time.strftime('%H:%M:%S', time.gmtime())} agent={self.headers.get('User-Agent', '-')}\n")
                  self.send_response(status)
                  sent = {k.lower(): v for k, v in headers.get(path, {}).items()} if body is not None else {}
                  if body is not None and 'content-type' not in sent:
                      sent['content-type'] = ctype
                  for k, v in sent.items():
                      self.send_header(k, v)
                  self.send_header('Content-Length', str(len(body or b'')))
                  self.end_headers()
                  if body:
                      self.wfile.write(body)
              def log_message(self, *a):
                  pass
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(cert, key)
          # The handshake runs in the connection's own thread, with a timeout.
          # Wrapping the listening socket instead (run 38242407082) does it in
          # accept() on the one main thread: a preconnect that never speaks
          # TLS then stalls every connection behind it, and swcd's request
          # timed out after 66 s with 0 bytes sent.
          class Server(http.server.ThreadingHTTPServer):
              address_family = socket.AF_INET6
              daemon_threads = True
              def server_bind(self):
                  self.socket.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 0)
                  super().server_bind()
              def finish_request(self, request, client_address):
                  request.settimeout(20)
                  try:
                      tls = ctx.wrap_socket(request, server_side=True)
                  except Exception as err:
                      with open(log, 'a') as out:
                          out.write(f"TLS-FAIL at={time.strftime('%H:%M:%S', time.gmtime())} {type(err).__name__}: {err}\n")
                      return
                  self.RequestHandlerClass(tls, client_address, self)
          httpd = Server(('::', 443), Handler)
          httpd.serve_forever()
          PY
          : > "$srv/requests.log"
          sudo -b python3 "$srv/server.py" "$PWD/dist" "$PWD/vercel.json" "$srv/requests.log" "$srv/cert.pem" "$srv/key.pem" > "$srv/server.out" 2>&1
          printf '127.0.0.1 www.scan-action.com\n::1 www.scan-action.com\n' | sudo tee -a /etc/hosts >/dev/null
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          echo "AASA_DIR=$srv" >> "$GITHUB_ENV"
          dest=$(python3 -c 'import json;print([r["destination"] for r in json.load(open("vercel.json"))["rewrites"] if r["source"]=="/.well-known/apple-app-site-association"][0])')
          echo "vercel.json rewrites /.well-known/apple-app-site-association to $dest"
          for i in $(seq 1 20); do curl -s -o /dev/null --cacert "$srv/cert.pem" https://www.scan-action.com/.well-known/nothing && break; sleep 1; done
          # Two readings from this host, each the other's control.
          code=$(curl -sS --cacert "$srv/cert.pem" -D "$srv/h.txt" -o "$srv/got.json" -w '%{http_code}' https://www.scan-action.com/.well-known/apple-app-site-association)
          type=$(grep -i '^content-type:' "$srv/h.txt" | tr -d '\r' | cut -d' ' -f2-)
          echo "association: HTTP $code, $type, $(wc -c < "$srv/got.json" | tr -d ' ') bytes"
          if [ "$code" != 200 ] || [ "$type" != application/json ]; then echo "FAIL: the association is not served as JSON at the well-known path"; cat "$srv/server.out"; exit 1; fi
          cmp "$srv/got.json" "public$dest" || { echo "FAIL: what is served differs from public$dest"; exit 1; }
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); ids=[i for x in d["applinks"]["details"] for i in x["appIDs"]]; print("appIDs:", ids); sys.exit(0 if sys.argv[2] in ids else "FAIL: the association does not name " + sys.argv[2])' "$srv/got.json" "$APP_ID"
          other=$(curl -sS --cacert "$srv/cert.pem" -o /dev/null -w '%{http_code}' https://www.scan-action.com/.well-known/nothing)
          test "$other" = 404 || { echo "control failed: an unrewritten path answered $other"; exit 1; }
          echo "control: an unrewritten path answers 404"
          echo "HOST_READS=$(wc -l < "$srv/requests.log" | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Open the confirm link through the system, cold and warm, and two links the app must not claim
        run: |
          set +e -u
          out="$RUNNER_TEMP/ul"; mkdir -p "$out"
          fails=0; fail() { echo "FAIL: $*"; fails=$((fails+1)); }
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[(r,x["udid"],x["name"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]; c.sort(); print(c[-1][1])')
          echo "simulator: $(xcrun simctl list devices available | grep "$udid")"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b | tail -n 1
          xcrun simctl keychain "$udid" add-root-cert "$AASA_DIR/cert.pem" || echo "(root certificate not added; developer mode accepts an untrusted one)"
          xcrun simctl install "$udid" "$APP"
          echo "installed at $(date -u +%T)"

          running() { xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -oE 'UIKitApplication:(com\.scanaction\.app|com\.apple\.mobilesafari)' | sort -u | tr '\n' ' '; }
          shot() { xcrun simctl io "$udid" screenshot "$out/$1.png" >/dev/null 2>&1 || true; }
          stop() { xcrun simctl terminate "$udid" "$BUNDLE_ID" >/dev/null 2>&1; xcrun simctl terminate "$udid" com.apple.mobilesafari >/dev/null 2>&1; sleep 3; rm -f "$marker"; }
          seen() { for i in $(seq 1 "$2"); do [ -f "$marker" ] && grep -qF "$1" "$marker" && return 0; sleep 1; done; return 1; }
          swcd_asked() { tail -n +"$((HOST_READS+1))" "$AASA_DIR/requests.log" | grep -c '^200 /.well-known/apple-app-site-association' || true; }

          # A plain launch first: it makes the data container, and a launch
          # that fails here is not a link failure.
          marker=/dev/null/none
          SIMCTL_CHILD_SA_LAUNCH_SMOKE=1 xcrun simctl launch "$udid" "$BUNDLE_ID" >/dev/null
          data=$(xcrun simctl get_app_container "$udid" "$BUNDLE_ID" data)
          marker="$data/tmp/launch-smoke.json"
          seen '"ready":"complete"' 120 || { echo "FAIL (not a link failure): the app did not launch to a loaded page"; cat "$marker" 2>/dev/null; exit 1; }
          stop
          mkdir -p "$data/Library"; touch "$data/Library/sa-smoke-watch"

          # Run 38240130251: swcd tried at boot, its connections were
          # cancelled, and it fetched only when a link on the domain was
          # opened. So while it has not fetched, open /login (a path the app
          # never claims) once a minute to make it look the domain up. The
          # measured opens below start only after a 200 reached swcd.
          echo "== swcd: wait up to 10 min for it to fetch from this runner's server (started $(date -u +%T)) =="
          for i in $(seq 1 120); do
            [ "$(swcd_asked)" -gt 0 ] && break
            if [ $((i % 12)) -eq 0 ]; then xcrun simctl openurl "$udid" https://www.scan-action.com/login; sleep 3; xcrun simctl terminate "$udid" com.apple.mobilesafari >/dev/null 2>&1; echo "  nudged swcd at $(date -u +%T)"; fi
            sleep 5
          done
          asked=$(swcd_asked)
          echo "requests swcd made: $(tail -n +"$((HOST_READS+1))" "$AASA_DIR/requests.log" | wc -l | tr -d ' ')"
          tail -n +"$((HOST_READS+1))" "$AASA_DIR/requests.log" | sed 's/^/  /'
          if [ "$asked" -eq 0 ]; then
            if grep -qF 'applinks:www.scan-action.com?mode=developer' "$RUNNER_TEMP/app-strings.txt"; then
              echo "HARNESS: the binary claims the domain in developer mode, yet swcd never fetched the association from this runner. This says nothing about the association itself."
            else
              fail "the binary claims no applinks:www.scan-action.com, so swcd had nothing to fetch"
            fi
            xcrun simctl spawn "$udid" log show --last 15m --predicate 'process == "swcd"' --style compact 2>/dev/null | grep -iE 'scan-action|scanaction|developer|mode|AASA|error|fail' | tail -n 30
            echo "server stderr:"; sudo cat "$AASA_DIR/server.out" | tail -n 30
          fi
          sleep 10

          echo "== A: the confirm link, app not running (cold start) =="
          stop; xcrun simctl openurl "$udid" "$LINK"
          if seen "\"href\":\"$IN_APP\"" 45; then echo "  the app opened on its confirm route"; else fail "cold: the app did not open on its confirm route (running: $(running))"; fi
          if seen '"confirm":"network"' 30; then echo "  the confirm screen reads network: verifyOtp got no answer, so nothing reached Supabase"; else fail "cold: the confirm screen did not read network ($(cat "$marker" 2>/dev/null))"; fi
          case "$(running)" in *mobilesafari*) fail "cold: Safari opened" ;; esac
          shot A-cold

          echo "== B: the confirm link, app already running (warm) =="
          stop; xcrun simctl launch "$udid" "$BUNDLE_ID" >/dev/null
          seen '"ready":"complete"' 60 || fail "warm: the app did not come up before the link"
          if grep -qF '/auth/confirm' "$marker" 2>/dev/null; then fail "warm: the app was already on the confirm route before the link"; fi
          xcrun simctl openurl "$udid" "$LINK"
          if seen "\"href\":\"$IN_APP\"" 45; then echo "  the running app moved to its confirm route"; else fail "warm: the running app did not move to its confirm route (running: $(running))"; fi
          seen '"confirm":"network"' 30 || fail "warm: the confirm screen did not read network"
          case "$(running)" in *mobilesafari*) fail "warm: Safari opened" ;; esac
          shot B-warm

          # Controls: the same domain, paths the association does not claim.
          # Safari must take them, which also proves openurl reaches Safari.
          n=0
          for url in https://www.scan-action.com/login 'https://www.scan-action.com/auth/confirm?type=email'; do
            n=$((n+1)); echo "== C$n: CONTROL $url =="
            stop; xcrun simctl openurl "$udid" "$url"; sleep 15
            r=$(running); echo "  running: $r"
            case "$r" in *mobilesafari*) ;; *) fail "control C$n: Safari did not open" ;; esac
            case "$r" in *scanaction*) fail "control C$n: the app opened for a path it must not claim" ;; esac
            shot "C$n-control"
          done
          stop

          if [ "$fails" -gt 0 ]; then echo "UNIVERSAL LINK CHECK FAILED: $fails reading(s) above"; exit 1; fi
          echo "UNIVERSAL LINK CHECK PASSED: swcd read this commit's association from this runner; the confirm link opened the app on /auth/confirm cold and warm; /login and a tokenless confirm link stayed in Safari; nothing reached Supabase"

      # The static half, run whatever happened above, so a missing entitlement
      # is named here even when the dynamic half already failed on it.
      - name: The committed entitlement, the link host and the association agree
        if: always()
        run: |
          set -eu
          python3 - <<'PY'
          import json, plistlib, re, sys
          e = plistlib.load(open('ios/App/App/App.entitlements', 'rb'))
          domains = e.get('com.apple.developer.associated-domains', [])
          host = re.search(r"AUTH_LINK_HOST = '([^']+)'", open('src/lib/authLinks.ts').read()).group(1)
          aasa = json.load(open('public/app-links/apple-app-site-association.json'))
          paths = [c.get('/') for d in aasa['applinks']['details'] for c in d.get('components', [])]
          print('App.entitlements associated domains:', domains)
          print('authLinks.ts host:', host, '| association paths:', paths)
          bad = []
          if f'applinks:{host}' not in domains: bad.append(f'App.entitlements does not claim applinks:{host}')
          if '/auth/confirm' not in paths: bad.append('the association does not claim /auth/confirm')
          for b in bad: print('FAIL:', b)
          sys.exit(1 if bad else 0)
          PY

      - name: Keep the screenshots and the server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal-link-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ul
            ${{ runner.temp }}/aasa/requests.log
          if-no-files-found: ignore
          retention-days: 7
