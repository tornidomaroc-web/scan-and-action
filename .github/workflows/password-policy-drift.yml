name: Password policy drift

# Does production still enforce the password minimum this repository CLAIMS it
# enforces? The Supabase setting is dashboard configuration: it moved 6 -> 8 on
# 2026-08-02 through a web UI with no PR, no test and no revert trail. Every
# other guard in this repo pins the repo against itself and would stay green.
#
# NOT A PR GATE, DELIBERATELY. A Supabase outage must never be able to wedge a
# merge. It runs on a schedule, on a push to main, and on demand, and only a
# real contradiction turns it red — see the three-way outcome in the script
# header.
#
# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  NEVER ADD THIS JOB TO REQUIRED STATUS CHECKS.                            ║
# ║                                                                           ║
# ║  It probes LIVE Supabase. Required means a Supabase outage blocks every    ║
# ║  merge in this repository — including the PR that fixes the outage. It     ║
# ║  also means a green tick that depends on a third party being up, which is  ║
# ║  not a statement about the code under review.                             ║
# ║                                                                           ║
# ║  It runs on `push: main` — AFTER a merge — and never on `pull_request`,    ║
# ║  so it cannot appear on a PR at all. Adding it to the ruleset would not    ║
# ║  make it a gate; it would make every PR wait forever for a check that      ║
# ║  never reports. Keep it off the list.                                     ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

on:
  schedule:
    # 07:00 UTC daily. Nothing depends on the hour; it is off-peak and stable.
    - cron: '0 7 * * *'
  workflow_dispatch:

  # ALSO ON ACTIVITY — and this is the load-bearing half, not a convenience.
  #
  # A cron's coverage and its failure mode are anti-correlated. GitHub disables
  # a schedule after 60 days of INACTIVITY, so the cron's unique value is
  # entirely in quiet periods, which is exactly the condition that kills it. It
  # is most valuable precisely when it is most likely to be dead.
  #
  # This trigger does NOT detect dormancy and does not claim to; the schedule
  # can still die silently. It removes the reason to care, by probing whenever
  # someone is actually working. See CLAUDE.md — "A scheduled workflow that
  # stopped running looks exactly like one that passes" — before reaching for a
  # freshness check, which was designed and rejected on 2026-08-03.
  #
  # `branches: [main]` means post-merge only. It must never become
  # `pull_request`, and it must never be widened to all branches: either would
  # put a live-Supabase probe on pull requests. Section 6 of
  # apps/frontend/tests/passwordPolicyDrift.test.ts fails if it is.
  push:
    branches: [main]

# The probe is a single unauthenticated-tier POST that is REJECTED by design,
# so it needs nothing from the repo but the ability to read it.
permissions:
  contents: read

jobs:
  drift:
    name: Password policy drift
    runs-on: ubuntu-latest
    steps:
      # ─────────────────────────────────────────────────────────────────────
      # THIS JOB KEEPS ITS ::warning:: CHANNEL EMPTY. That is a correctness
      # requirement here, not tidiness.
      #
      # The probe reports UNREACHABLE — "the password policy was NOT checked on
      # this run" — as a ::warning:: annotation, deliberately not as a red
      # badge (see the three-way outcome in the script header). So a warning on
      # this job has exactly one meaning: coverage was lost. Anything else
      # standing permanently in that channel means the one signal that says
      # "this monitor did not do its job today" has to be picked out of noise
      # that is there every single day — and a signal you have to hunt for is
      # one you stop looking for.
      #
      # Observed on run 30806299900 (2026-08-03), the last run before this
      # change, the channel was NOT empty:
      #
      #   ##[warning]Node.js 20 is deprecated. The following actions target
      #   Node.js 20 but are being forced to run on Node.js 24:
      #   actions/checkout@v4, actions/setup-node@v4
      #
      # It named BOTH actions, so dropping setup-node alone would not have
      # cleared it. checkout@v5 is the first major that runs on node24; v6 and
      # v7 also do, and add behaviour this job does not use.
      # ─────────────────────────────────────────────────────────────────────
      - uses: actions/checkout@v5

      # NO actions/setup-node, DELIBERATELY — and no `npm ci` either. The
      # script imports nothing outside node: builtins and uses the runtime's
      # own fetch, so the Node already on the runner is all it has ever needed.
      # setup-node was not free: it contributed half of the deprecation warning
      # above, and it downloaded a Node tarball over the network on every run
      # (observed acquiring 20.20.2 on run 30806299900) — minutes and a
      # supply-chain surface added to a check whose whole job is to be boring
      # and reliable.
      #
      # This step is what replaces it: not a toolchain, just a record. Node now
      # arrives from the runner image rather than from a pinned download, so
      # the log states which one ran instead of leaving it to be inferred.
      - name: Record the Node the runner provided
        run: node --version

      - name: Probe the signup endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # ANON key only — the public key that already ships inside the client
          # bundle. The service-role key bypasses the password policy entirely,
          # so a probe holding one would report success no matter what the
          # policy said. It must never appear in this workflow.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node apps/frontend/scripts/verifyPasswordPolicy.mjs
