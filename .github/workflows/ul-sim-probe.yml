name: Universal link simulator probe (throwaway, never merged)

# Question: can an iOS Simulator on a hosted macOS runner witness
# https://www.scan-action.com/auth/confirm opening INSIDE the app (universal
# link), rather than in Safari? Runs only on a push to probe/ul-sim. No
# secrets: the web bundle's Supabase URL and anon key are read from the
# public bundle that www.scan-action.com serves, the backend URL points
# nowhere, and the token in the link is a fake, so Supabase answers 403.

on:
  push:
    branches: [probe/ul-sim]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Public Supabase settings from the served bundle
        run: |
          set -eu
          asset=$(curl -sS https://www.scan-action.com/ | grep -oE 'assets/index-[^"]+\.js' | head -n 1)
          curl -sS -o "$RUNNER_TEMP/live.js" "https://www.scan-action.com/$asset"
          python3 - "$RUNNER_TEMP/live.js" >> "$GITHUB_ENV" <<'PY'
          import base64, json, re, sys
          js = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          url = sorted(set(re.findall(r'https://[a-z0-9]{20}\.supabase\.co', js)))
          assert len(url) == 1, url
          keys = sorted(set(re.findall(r'sb_publishable_[A-Za-z0-9_-]+', js)))
          assert len(keys) == 1, f'{len(keys)} publishable keys'
          print(f'VITE_SUPABASE_URL={url[0]}')
          print(f'VITE_SUPABASE_ANON_KEY={keys[0]}')
          PY
          echo "VITE_API_URL=https://backend-blocked.invalid/api" >> "$GITHUB_ENV"
          echo "supabase settings read from $asset"

      - name: Build the web bundle and sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Resolve Swift packages from the committed Package.resolved
        run: |
          set -eu -o pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -onlyUsePackageVersionsFromResolvedFile 2>&1 | tail -n 5

      # The committed App.entitlements plus the two identifiers a signed
      # build carries (build 24 lists both). A simulator build is ad-hoc
      # signed ("-"); no certificate or profile exists on this runner.
      - name: Build for the Simulator, ad-hoc signed with the entitlements
        run: |
          set -eu -o pipefail
          ent="$RUNNER_TEMP/probe.entitlements"
          cp ios/App/App/App.entitlements "$ent"
          /usr/libexec/PlistBuddy -c "Add :application-identifier string NQ23SMHXJV.com.scanaction.app" "$ent"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string NQ23SMHXJV" "$ent"
          echo "== probe entitlements =="; plutil -p "$ent"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=NQ23SMHXJV PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS="$ent" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -E '^(error|\*\*)|: error:' || true; }
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "== as built: signature =="; codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -p - 2>&1 | head -n 20 || echo "(empty)"
          echo "== as built: __entitlements section names associated-domains? =="; strings - "$app/App" | grep -c 'com.apple.developer.associated-domains' || true
          # Re-sign ad hoc WITH the entitlements, so the signature itself carries them.
          codesign --force --sign - --timestamp=none --entitlements "$ent" "$app"
          echo "== after re-sign: signature =="; codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -p - | tee "$RUNNER_TEMP/sig.txt"
          grep -q 'applinks:www.scan-action.com' "$RUNNER_TEMP/sig.txt" || { echo "FAIL: the re-signed app still carries no associated-domains entitlement"; exit 1; }

      - name: Open the confirm link through the system, three ways
        run: |
          set +e
          out="$RUNNER_TEMP/probe"; mkdir -p "$out"
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[(r,x["udid"],x["name"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]; c.sort(); print(c[-1][1])')
          dev="$HOME/Library/Developer/CoreSimulator/Devices/$udid"
          echo "simulator: $(xcrun simctl list devices available | grep "$udid")"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b | tail -n 1
          xcrun simctl install "$udid" "$APP"
          echo "installed at $(date -u +%T)"

          running() { xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -oE 'UIKitApplication:(com\.scanaction\.app|com\.apple\.mobilesafari)' | sort -u | tr '\n' ' '; }
          shot() { xcrun simctl io "$udid" screenshot "$out/$1.png" >/dev/null 2>&1 && echo "  screenshot $1.png"; }
          reset() { xcrun simctl terminate "$udid" com.scanaction.app >/dev/null 2>&1; xcrun simctl terminate "$udid" com.apple.mobilesafari >/dev/null 2>&1; sleep 3; }

          echo "== 0: does the re-signed app launch at all? =="
          xcrun simctl launch "$udid" com.scanaction.app; echo "  launch rc=$?"; sleep 12
          echo "  running: $(running)"; shot 0-plain-launch
          reset

          echo "== swc database: wait up to 6 min for www.scan-action.com =="
          db=""
          for i in $(seq 1 36); do
            db=$(find "$dev/data" -name 'swc.db' 2>/dev/null | head -n 1)
            if [ -n "$db" ] && sqlite3 "$db" .dump 2>/dev/null | grep -q 'scan-action'; then echo "  listed after $((i*10)) s"; break; fi
            sleep 10
          done
          echo "  db: ${db:-(none found)}"
          if [ -n "$db" ]; then
            echo "  tables: $(sqlite3 "$db" '.tables' 2>/dev/null | tr -s ' \n' ' ')"
            sqlite3 "$db" .dump 2>/dev/null | grep -i 'scan-action' | cut -c1-400 | head -n 12 > "$out/swcdb.txt"
            cat "$out/swcdb.txt"
          fi
          xcrun simctl spawn "$udid" log show --last 10m --predicate 'process == "swcd"' --style compact 2>/dev/null | grep -iE 'scan-action|scanaction|NQ23SMHXJV' | tail -n 20

          LINK='https://www.scan-action.com/auth/confirm?token_hash=ulprobe0000&type=email'

          echo "== A: confirm link, app not running (cold start) =="
          reset; xcrun simctl openurl "$udid" "$LINK"; echo "  openurl rc=$?"; sleep 15
          echo "  running: $(running)"; shot A-cold-confirm

          echo "== C: confirm link, app already running (warm) =="
          reset; xcrun simctl launch "$udid" com.scanaction.app >/dev/null; echo "  launch rc=$?"; sleep 12
          xcrun simctl openurl "$udid" "$LINK"; echo "  openurl rc=$?"; sleep 15
          echo "  running: $(running)"; shot C-warm-confirm

          echo "== B: CONTROL, an unclaimed path (/login), app not running =="
          reset; sleep 5; xcrun simctl openurl "$udid" "https://www.scan-action.com/login"; echo "  openurl rc=$?"; sleep 15
          echo "  running: $(running)"; shot B-control-login

          xcrun simctl spawn "$udid" log show --last 12m --predicate 'process == "App"' --style compact 2>/dev/null \
            | grep -iE 'appUrlOpen|auth/confirm|userActivity|getLaunchUrl|verify' \
            | sed -E 's/token_hash=[^& ]+/token_hash=<probe>/g' | tail -n 40 > "$out/app.txt"
          echo "== app log lines =="; cat "$out/app.txt"
          xcrun simctl spawn "$udid" log show --last 12m --predicate 'process == "SpringBoard" AND eventMessage CONTAINS[c] "scanaction"' --style compact 2>/dev/null | grep -iE 'denied|fail|error|launch' | tail -n 15

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ul-sim-probe
          path: ${{ runner.temp }}/probe
