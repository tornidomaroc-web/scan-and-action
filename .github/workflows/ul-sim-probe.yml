name: Universal link simulator probe (throwaway, never merged)

# Question: can an iOS Simulator on a hosted macOS runner witness
# https://www.scan-action.com/auth/confirm opening INSIDE the app (universal
# link), rather than in Safari? Runs only on a push to probe/ul-sim. No
# secrets: the web bundle's Supabase URL and anon key are read from the
# public bundle that www.scan-action.com serves, the backend URL points
# nowhere, and the token in the link is a fake, so Supabase answers 403.

on:
  push:
    branches: [probe/ul-sim]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Public Supabase settings from the served bundle
        run: |
          set -eu
          asset=$(curl -sS https://www.scan-action.com/ | grep -oE 'assets/index-[^"]+\.js' | head -n 1)
          curl -sS -o "$RUNNER_TEMP/live.js" "https://www.scan-action.com/$asset"
          python3 - "$RUNNER_TEMP/live.js" >> "$GITHUB_ENV" <<'PY'
          import base64, json, re, sys
          js = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          url = sorted(set(re.findall(r'https://[a-z0-9]{20}\.supabase\.co', js)))
          assert len(url) == 1, url
          ref = url[0][8:28]
          key = None
          for t in set(re.findall(r'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', js)):
              p = t.split('.')[1]
              p += '=' * (-len(p) % 4)
              c = json.loads(base64.urlsafe_b64decode(p))
              if c.get('role') == 'anon' and c.get('ref') == ref:
                  key = t
          assert key, 'no anon key for the ref'
          print(f'VITE_SUPABASE_URL={url[0]}')
          print(f'VITE_SUPABASE_ANON_KEY={key}')
          PY
          echo "VITE_API_URL=https://backend-blocked.invalid/api" >> "$GITHUB_ENV"
          echo "supabase settings read from $asset"

      - name: Build the web bundle and sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Resolve Swift packages from the committed Package.resolved
        run: |
          set -eu -o pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -onlyUsePackageVersionsFromResolvedFile 2>&1 | tail -n 5

      # The committed App.entitlements plus the two identifiers a signed
      # build carries (build 24 lists both). A simulator build is ad-hoc
      # signed ("-"); no certificate or profile exists on this runner.
      - name: Build for the Simulator, ad-hoc signed with the entitlements
        run: |
          set -eu -o pipefail
          ent="$RUNNER_TEMP/probe.entitlements"
          cp ios/App/App/App.entitlements "$ent"
          /usr/libexec/PlistBuddy -c "Add :application-identifier string NQ23SMHXJV.com.scanaction.app" "$ent"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string NQ23SMHXJV" "$ent"
          echo "== probe entitlements =="; plutil -p "$ent"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=NQ23SMHXJV PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS="$ent" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -E '^(error|\*\*)|: error:' || true; }
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "== entitlements in the signature =="; codesign -d --entitlements - "$app" 2>&1 | tail -n 30

      - name: Open the confirm link through the system, three ways
        run: |
          set -u
          out="$RUNNER_TEMP/probe"; mkdir -p "$out"
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[(r,x["udid"],x["name"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]; c.sort(); print(c[-1][1])')
          echo "simulator: $(xcrun simctl list devices available | grep "$udid")"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b | tail -n 1
          xcrun simctl install "$udid" "$APP"
          echo "installed at $(date -u +%T); waiting 90 s for swcd to fetch the association"
          sleep 90
          xcrun simctl spawn "$udid" log show --last 4m --predicate 'process == "swcd"' --style compact 2>/dev/null | grep -iE 'scan-action|scanaction|applinks|error|fail' | tail -n 40 > "$out/swcd.txt" || true
          echo "== swcd lines mentioning us or errors =="; cat "$out/swcd.txt"
          echo "== swcutil show (if present) =="; xcrun simctl spawn "$udid" swcutil show 2>&1 | grep -iE -B2 -A12 'scan-action' | head -n 40 || echo "(swcutil unavailable)"

          front() {
            sleep 15
            echo "  running: $(xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -oE 'UIKitApplication:(com\.scanaction\.app|com\.apple\.mobilesafari)' | sort -u | tr '\n' ' ')"
            xcrun simctl io "$udid" screenshot "$out/$1.png" >/dev/null 2>&1 && echo "  screenshot $1.png"
          }
          reset() { xcrun simctl terminate "$udid" com.scanaction.app >/dev/null 2>&1; xcrun simctl terminate "$udid" com.apple.mobilesafari >/dev/null 2>&1; sleep 3; }
          LINK='https://www.scan-action.com/auth/confirm?token_hash=ulprobe0000&type=email'

          echo "== A: confirm link, app not running (cold start) =="
          reset; xcrun simctl openurl "$udid" "$LINK"; front A-cold-confirm

          echo "== B: CONTROL, an unclaimed path (/login), app not running =="
          reset; xcrun simctl openurl "$udid" "https://www.scan-action.com/login"; front B-control-login

          echo "== C: confirm link, app already running (warm) =="
          reset; xcrun simctl launch "$udid" com.scanaction.app >/dev/null; sleep 12
          xcrun simctl openurl "$udid" "$LINK"; front C-warm-confirm

          xcrun simctl spawn "$udid" log show --last 6m --predicate 'process == "App"' --style compact 2>/dev/null \
            | grep -iE 'appUrlOpen|auth/confirm|continueUserActivity|userActivity|getLaunchUrl|verify|To Native|Result' \
            | sed -E 's/token_hash=[^& ]+/token_hash=<probe>/g' | tail -n 60 > "$out/app.txt" || true
          echo "== app log lines =="; cat "$out/app.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ul-sim-probe
          path: ${{ runner.temp }}/probe
