<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The mark (concept A, one drawing), emitted from <BrandMark size={32} />. Inline rather
         than a file on purpose: an /icons/*.svg path that 404s is served the SPA
         fallback as 200 text/html, which is indistinguishable from a working
         favicon. `brandMark.test.tsx` re-renders the component and byte-compares
         this href, so the two copies cannot drift. Do not hand-edit. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg width='32' height='32' viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg' role='presentation'%3E%3Cdefs%3E%3ClinearGradient id='sa-brand-grad' gradientUnits='userSpaceOnUse' x1='0' y1='512' x2='512' y2='0'%3E%3Cstop offset='0' stop-color='%2300286D'%3E%3C/stop%3E%3Cstop offset='0.62' stop-color='%23006784'%3E%3C/stop%3E%3Cstop offset='1' stop-color='%2300BB9F'%3E%3C/stop%3E%3C/linearGradient%3E%3CradialGradient id='sa-brand-lift' gradientUnits='userSpaceOnUse' cx='256' cy='194.56' r='317.44'%3E%3Cstop offset='0' stop-color='%23FFFFFF' stop-opacity='0.10'%3E%3C/stop%3E%3Cstop offset='1' stop-color='%23FFFFFF' stop-opacity='0'%3E%3C/stop%3E%3C/radialGradient%3E%3Cfilter id='sa-brand-shadow' x='-20%25' y='-20%25' width='140%25' height='150%25'%3E%3CfeDropShadow dx='0' dy='5' stdDeviation='6' flood-color='%23000000' flood-opacity='0.28'%3E%3C/feDropShadow%3E%3C/filter%3E%3C/defs%3E%3Crect x='0' y='0' width='512' height='512' fill='url(%23sa-brand-grad)'%3E%3C/rect%3E%3Crect x='0' y='0' width='512' height='512' fill='url(%23sa-brand-lift)'%3E%3C/rect%3E%3Cg filter='url(%23sa-brand-shadow)' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cg stroke='%23FFFFFF' stroke-width='42'%3E%3Cpath d='M 131 200 V 165 A 34 34 0 0 1 165 131 H 200'%3E%3C/path%3E%3Cpath d='M 312 131 H 347 A 34 34 0 0 1 381 165 V 200'%3E%3C/path%3E%3Cpath d='M 381 312 V 347 A 34 34 0 0 1 347 381 H 312'%3E%3C/path%3E%3Cpath d='M 200 381 H 165 A 34 34 0 0 1 131 347 V 312'%3E%3C/path%3E%3C/g%3E%3Cpath d='M 196 260 L 239 303 L 321 215' stroke='%238CFCF9' stroke-width='48'%3E%3C/path%3E%3C/g%3E%3C/svg%3E" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
         real values inside the Android 15 edge-to-edge WebView (and iOS notches). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scan & Action | Industrial Document Intelligence</title>
    <meta name="description" content="Production-ready document extraction powered by Gemini Vision AI." />
    <!-- PWA: manifest only, deliberately no service worker (live checkout
         on this domain — stale-cache risk not taken this phase). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Safari paints its own toolbars in theme-color. One per scheme, in the
         page's own surface colours (tokens.css --sa-surface), and the boot
         script below plus lib/themeColor.ts keep it on the stored choice: a
         single slate value showed as a blue band under the tab bar on the
         owner's iPhone (2026-09-26). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6FA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1014" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScanAction" />
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        const dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        // A stored choice overrides the scheme media queries on the two
        // theme-color metas above: both take the chosen surface.
        if (theme === 'dark' || theme === 'light') {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', dark ? '#0F1014' : '#F5F6FA');
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
