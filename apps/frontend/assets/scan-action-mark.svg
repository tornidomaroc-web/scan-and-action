<!--
  Scan & Action app mark - VECTOR MASTER: concept A, "Viewfinder check"
  ================================================================
  Chosen by the owner on 2026-10-12 from the icon round (artifact
  KWMnD7L81GdwrmX3V4AkcX), in the icon colour family. It replaces the
  document + check + scan beam mark reconstructed on 2026-07-17
  (docs/ICON_MASTER_REBUILD.md); that file is in git history.

  EVERY app-icon surface is generated from this file and nothing else:
  apps/frontend/assets/generate-android-icons.py writes the Android adaptive
  layers (background, foreground, monochrome), the legacy launchers, both
  splashes, the iOS 1024, the four web icons and the Play listing 512.
  BrandMark.tsx transcribes it for the app and the favicon, and
  tests/brandMark.test.tsx reads it back and compares. Do not restyle one
  surface: the Play rejection of 2026-07-17 was the launcher icon differing
  from the store listing, so drift IS the defect.

  STRUCTURE - the two top-level groups are independently renderable:
    #background  the plate: a navy -> teal gradient, plus a faint white lift
    #mark        the drawing on a TRANSPARENT backdrop: four viewfinder
                 corners (white) and a check (cyan), with one soft shadow

  COLOURS (all from the existing mark, none new):
    navy #00286D, middle #006784, teal #00BB9F, cyan #8CFCF9, white #FFFFFF.
    The gradient puts #006784 at 62% so the glyph sits on the darker part:
    white on #006784 is 6.42:1, cyan on #006784 5.32:1. (The previous mark's
    cyan check sat on teal at 2.02:1.)

  DEPTH, kept light (Apple HIG, App icons, June 2026: let the system add
  highlights and shadows): one drop shadow under the glyph, dy 5, blur 6,
  28% black, and a 10% white lift at the top of the plate. Nothing sits
  between a glyph and the plate it is read against.

  GEOMETRY (512 space): corners centre-line 131..381, stroke 42, radius 34;
  check (196,260) (239,303) (321,215), stroke 48. The glyph is centred, and
  its ink (shadow included) stays inside the maskable circle (r 204.8) and,
  once the whole canvas maps onto Android's central 72dp, inside the 66dp
  safe circle. The generator measures both on every run.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Scan &amp; Action app mark</title>
  <desc>Concept A, Viewfinder check. Groups are separable: #background is the plate, #mark is
  the drawing on a transparent backdrop and is what the adaptive-icon foreground, the monochrome
  layer and the splash are cut from.</desc>
  <defs>
    <linearGradient id="bgGrad" gradientUnits="userSpaceOnUse" x1="0" y1="512" x2="512" y2="0">
      <stop offset="0" stop-color="#00286D"/>
      <stop offset="0.62" stop-color="#006784"/>
      <stop offset="1" stop-color="#00BB9F"/>
    </linearGradient>
    <radialGradient id="bgLift" gradientUnits="userSpaceOnUse" cx="256" cy="194.56" r="317.44">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#bgLift)"/>
  </g>
  <g id="mark">
    <g id="glyph" filter="url(#markShadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g id="corners" stroke="#FFFFFF" stroke-width="42">
        <path id="corner-tl" d="M 131 200 V 165 A 34 34 0 0 1 165 131 H 200"/>
        <path id="corner-tr" d="M 312 131 H 347 A 34 34 0 0 1 381 165 V 200"/>
        <path id="corner-br" d="M 381 312 V 347 A 34 34 0 0 1 347 381 H 312"/>
        <path id="corner-bl" d="M 200 381 H 165 A 34 34 0 0 1 131 347 V 312"/>
      </g>
      <path id="check" d="M 196 260 L 239 303 L 321 215" stroke="#8CFCF9" stroke-width="48"/>
    </g>
  </g>
</svg>
